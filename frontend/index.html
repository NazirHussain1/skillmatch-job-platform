<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>SkillMatch - Job Search and Hiring Platform</title>
    <meta name="title" content="SkillMatch - Job Search and Hiring Platform" />
    <meta name="description" content="Discover jobs, apply with your profile, manage hiring pipelines, and connect job seekers with employers on SkillMatch." />
    <meta name="keywords" content="job search, hiring platform, recruitment, careers, job board, employer hiring, application tracking" />
    <meta name="author" content="SkillMatch" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkillMatch" />
    <meta property="og:title" content="SkillMatch - Job Search and Hiring Platform" />
    <meta property="og:description" content="Discover jobs, apply with your profile, and manage professional hiring pipelines." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="SkillMatch - Job Search and Hiring Platform" />
    <meta property="twitter:description" content="Discover jobs, apply with your profile, and manage professional hiring pipelines." />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0ea5e9" />
    
    <!-- Preconnect to API domain for faster requests -->
    <!-- <link rel="preconnect" href="https://your-api-domain.com" /> -->
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
